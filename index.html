*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {

.header {

  box-shadow: 0 3px 16px rgba(13,63,120,.3);

.header-inner { max-width: 960px; margin: auto; }
.header-badge {

  padding: 4px 12px; margin-bottom: 10px;
}
.header-badge::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;

}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
.header h1 { font-size: clamp(15px, 3.2vw, 20px); font-weight: 700; line-height: 1.4; margin-bottom: 4px; }
.header-sub { font-size: 13px; opacity: .75; }

.stats-bar { background: var(--white); border-bottom: 1px solid var(--gray2); padding: 14px 24px; }
.stats-inner { max-width: 960px; margin: auto; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.stat-item { display: flex; align-items: baseline; gap: 6px; }
.stat-num { font-size: 22px; font-weight: 700; color: var(--blue); }
.stat-label { font-size: 12px; color: var(--gray3); }
.stat-divider { width: 1px; height: 28px; background: var(--gray2); }

.month-nav { background: var(--white); border-bottom: 1px solid var(--gray2); overflow-x: auto; -webkit-overflow-scrolling: touch; }
.month-nav-inner { max-width: 960px; margin: auto; display: flex; padding: 0 16px; gap: 0; min-width: max-content; }
.month-tab {

  color: var(--gray3); border: none; background: none; cursor: pointer;

.month-tab .tab-count {
  display: inline-block; background: var(--gray2); color: var(--text2);
  border-radius: 10px; font-size: 11px; padding: 1px 7px; margin-left: 6px;
  font-weight: 600; transition: all .18s;
}
.month-tab:hover { color: var(--blue2); }
.month-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.month-tab.active .tab-count { background: var(--accent); color: var(--blue); }

.search-wrap input:focus { border-color: var(--blue2); }
.search-wrap input::placeholder { color: var(--gray3); }
select {

.result-count { max-width: 960px; margin: 10px auto 0; padding: 0 16px; font-size: 12px; color: var(--gray3); }

.cards {

.card {

.footer { text-align: center; padding: 16px; font-size: 11px; color: var(--gray3); }

@media (max-width: 500px) {
  .header { padding: 20px 16px; }

const depts = [...new Set(nurses.map(n => n.dept))].sort();
const deptColors = {};
const palette = ['#1a5fa8','#0f7a52','#6d28d9','#b94a00','#0e7490','#9f1239','#065f46','#7e22ce','#b91c1c','#155e75','#374151','#78350f','#1e3a5f','#4c1d95','#166534'];
depts.forEach((d, i) => { deptColors[d] = palette[i % palette.length]; });

const selectEl = document.getElementById('dept-filter');
const chipsEl  = document.getElementById('chips');
document.getElementById('dept-count').textContent = depts.length;

depts.forEach(d => {
  const opt = document.createElement('option');
  opt.value = d;
  opt.textContent = d.replace('กลุ่มงานการพยาบาล','').trim();
  selectEl.appendChild(opt);
});

const allChip = document.createElement('div');
allChip.className = 'dept-chip active'; allChip.textContent = 'ทั้งหมด'; allChip.dataset.dept = '';
chipsEl.appendChild(allChip);
depts.forEach(d => {
  const c = document.createElement('div');
  c.className = 'dept-chip';
  c.textContent = d.replace('กลุ่มงานการพยาบาล','').replace('ผู้ป่วย','').trim();
  c.dataset.dept = d; chipsEl.appendChild(c);
});

let activeMonth = 'all', activeDept = '', searchVal = '';

function setMonth(m, el) {
  activeMonth = m;
  document.querySelectorAll('.month-tab').forEach(t => t.classList.toggle('active', t === el));
  render();
}

function formatDate(d) {
  const [y, mo, day] = d.split('-');
  const months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${parseInt(day)} ${months[parseInt(mo)]} ${y}`;
}

function render() {
  const q = searchVal.toLowerCase();
  const filtered = nurses.filter(n => {
    const name = (n.prefix + n.fname + n.lname).toLowerCase();
    return (!q || name.includes(q)) &&
           (activeMonth === 'all' || n.m === activeMonth) &&
           (!activeDept || n.dept === activeDept);
  });

  document.getElementById('total-shown').textContent = filtered.length;
  document.getElementById('result-count').textContent =
    filtered.length === nurses.length
      ? `แสดงทั้งหมด ${filtered.length} ราย`
      : `แสดง ${filtered.length} จาก ${nurses.length} ราย`;

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';

  if (!filtered.length) {
    cardsEl.innerHTML = '<div class="empty">ไม่พบรายชื่อที่ค้นหา</div>';
    return;
  }

  filtered.forEach((n, i) => {
    const mc = MONTH_COLORS[n.m];
    const dc = deptColors[n.dept] || '#1a5fa8';
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = Math.min(i * 0.03, 0.5) + 's';
    card.style.borderLeftColor = mc.border;
    const dateBg = mc.badge;
    const dateColor = mc.badgeText;

    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px">
        <span><span class="month-badge" style="background:${mc.badge};color:${mc.badgeText}">${n.m}</span>${n.new ? '<span class="month-badge" style="background:#dcfce7;color:#166534;margin-left:6px">ใหม่</span>' : ''}</span>
        <span class="pos-num">ลำดับ ${n.no}</span>
      </div>
      <div class="card-top">
        <div class="avatar" style="background:${dc}18;color:${dc}">${n.fname.charAt(0)}</div>
        <div>
          <div class="card-name">${n.prefix}${n.fname} ${n.lname}</div>
          <div class="card-pos">เลขตำแหน่ง ${n.pos}</div>
        </div>
      </div>
      <div class="card-dept" style="background:${dc}15;color:${dc}">${n.dept}</div>
      <div class="card-meta">
        <div class="date-chip" style="background:${dateBg};color:${dateColor}">สามารถทำชำนาญการ ${formatDate(n.date)}</div>
      </div>
      ${n.note ? `<div class="note-chip" style="background:#fef7e6;color:#b45309">${n.note}</div>` : ''}
    `;
    cardsEl.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input', e => { searchVal = e.target.value; render(); });
selectEl.addEventListener('change', e => {
  activeDept = e.target.value;
  document.querySelectorAll('.dept-chip').forEach(c => c.classList.toggle('active', c.dataset.dept === activeDept));
  render();
});
chipsEl.addEventListener('click', e => {
  const chip = e.target.closest('.dept-chip');
  if (!chip) return;
  activeDept = chip.dataset.dept;
  document.querySelectorAll('.dept-chip').forEach(c => c.classList.toggle('active', c === chip));
  selectEl.value = activeDept;
  render();
});

render();
</script>
